name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r src/sidecar/requirements-dev.txt

      - name: Run tests with coverage
        run: pytest
