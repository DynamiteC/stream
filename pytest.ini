[pytest]
# The sidecar is a standalone script; tests live next to it and import it by
# path via conftest.py. Keep test discovery scoped to that package for now.
testpaths =
    src/sidecar
    src/control-plane/streaming_console/streaming_console
python_files = test_*.py
addopts = -ra --cov=src/sidecar --cov=src/control-plane/streaming_console/streaming_console --cov-config=.coveragerc --cov-report=term-missing
